<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Snipwright project document (.vprj).

    A page carrying a single length of film with one frame cut out of it.

    Deliberately simpler than the application icon.  A document icon is read at
    16-32px in a file manager's list view, where scissors reduce to a cross
    with two dots on it and stop meaning anything.  The film strip alone still
    says "video" at any size, and the missing frame - a plain gap - says
    "edited" without needing any detail at all.
  -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfdfe"/>
      <stop offset="1" stop-color="#e4eaf1"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4285d6"/>
      <stop offset="1" stop-color="#2a5a94"/>
    </linearGradient>
  </defs>

  <!-- page with a folded corner -->
  <path d="M48 20 h116 l44 44 v168 a4 4 0 0 1 -4 4 h-156 a4 4 0 0 1 -4 -4 v-208 a4 4 0 0 1 4 -4 z"
        fill="url(#paper)" stroke="#aab6c6" stroke-width="5"/>
  <path d="M164 20 v40 a4 4 0 0 0 4 4 h40 z"
        fill="#c9d4e1" stroke="#aab6c6" stroke-width="5" stroke-linejoin="round"/>

  <!-- film strip, straight across, edge to edge so it reads as a strip -->
  <rect x="30" y="112" width="196" height="96" rx="7" fill="#37455e"/>

  <!-- sprocket holes: four per edge, large -->
  <g fill="#e9eef5">
    <rect x="42"  y="121" width="20" height="14" rx="4"/>
    <rect x="88"  y="121" width="20" height="14" rx="4"/>
    <rect x="148" y="121" width="20" height="14" rx="4"/>
    <rect x="194" y="121" width="20" height="14" rx="4"/>
    <rect x="42"  y="185" width="20" height="14" rx="4"/>
    <rect x="88"  y="185" width="20" height="14" rx="4"/>
    <rect x="148" y="185" width="20" height="14" rx="4"/>
    <rect x="194" y="185" width="20" height="14" rx="4"/>
  </g>

  <!-- two kept frames, with the cut frame missing between them -->
  <rect x="42"  y="144" width="66" height="32" rx="4" fill="url(#pane)"/>
  <rect x="148" y="144" width="66" height="32" rx="4" fill="url(#pane)"/>

  <!-- the cut itself: a clean gap straight through the strip -->
  <rect x="114" y="106" width="28" height="108" fill="#fcfdfe"/>
  <rect x="122" y="100" width="12" height="120" rx="6" fill="#4aa3f0"/>
</svg>
