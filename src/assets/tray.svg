<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Watcher tray icon: a length of film, nothing else.

    No cut and no scissors, deliberately.  The watcher's job is to notice new
    recordings, not to cut them, so a plain strip is the honest emblem - and at
    22px, which is where this lives, anything with more than two features turns
    to porridge.

    Note the bottom-right corner is left clear: make_tray_icon() paints a green
    status dot there while a scan is running, and the artwork must not compete
    with it.
  -->
  <defs>
    <linearGradient id="strip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9f5"/>
      <stop offset="1" stop-color="#2f7fd4"/>
    </linearGradient>
  </defs>

  <!-- strip body -->
  <rect x="3" y="14" width="58" height="36" rx="5" fill="url(#strip)"/>

  <!-- sprocket holes: five per edge, large and square -->
  <g fill="#0b1522">
    <rect x="8"  y="18" width="7" height="6" rx="1.6"/>
    <rect x="19" y="18" width="7" height="6" rx="1.6"/>
    <rect x="30" y="18" width="7" height="6" rx="1.6"/>
    <rect x="41" y="18" width="7" height="6" rx="1.6"/>
    <rect x="52" y="18" width="7" height="6" rx="1.6"/>
    <rect x="8"  y="40" width="7" height="6" rx="1.6"/>
    <rect x="19" y="40" width="7" height="6" rx="1.6"/>
    <rect x="30" y="40" width="7" height="6" rx="1.6"/>
    <rect x="41" y="40" width="7" height="6" rx="1.6"/>
    <rect x="52" y="40" width="7" height="6" rx="1.6"/>
  </g>

  <!-- two picture frames -->
  <g fill="#0d2949">
    <rect x="8"  y="27" width="22" height="10" rx="2"/>
    <rect x="34" y="27" width="22" height="10" rx="2"/>
  </g>
</svg>
